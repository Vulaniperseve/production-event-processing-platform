# Prometheus: scrapes the platform exporter and itself, evaluates alert rules.
global:
  scrape_interval: 30s
  # Generous: on a small, busy laptop a scrape can take >10 s (the default),
  # which would look like the exporter being down.
  scrape_timeout: 20s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: platform
    static_configs:
      - targets: ["metrics-exporter:9200"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
