# Ruff: linting (bugs, unused code, import order) and security checks
# (the "S" rules are Bandit's: SQL injection, unsafe subprocess, hard-coded
# passwords, insecure randomness...).  Run: ruff check .
target-version = "py312"
line-length = 110
extend-exclude = ["venv", "airflow/logs", "data", "airflow/plugins"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # import order
    "B",        # bugbear: likely bugs
    "S",        # bandit: security
    "UP",       # modern Python syntax
]
ignore = [
    "E501",     # long lines: wrapped by judgement, not by a hard limit
]

[lint.per-file-ignores]
# Tests use assert, fake credentials and temp paths by design.
"tests/**" = ["S101", "S105", "S106", "S108", "S608"]
