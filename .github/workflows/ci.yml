# Continuous Integration
#
# Runs on every push and pull request to main:
#   1. installs the pinned dependencies on a clean Linux machine
#   2. checks that every Python file (including the Airflow DAG) compiles
#   3. runs the unit tests (no database), including the dashboard logic
#   4. runs the integration tests against a real PostgreSQL 16 service
#   5. runs the Spark data lake tests (PySpark on Java 17)
#   6. checks the Terraform (format + validate; no AWS credentials needed)
#   7. checks the Prometheus config and unit-tests the alert rules (promtool)
#   8. lint + security: Ruff (incl. Bandit rules), gitleaks over the full
#      history, pip-audit on every requirements file, Trivy config scan
#
# Python 3.12 matches the apache/airflow:3.1.0 image the pipeline runs on.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows a manual run from the Actions tab

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dashboard/requirements.txt
            monitoring/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dashboard/requirements.txt -r monitoring/requirements.txt

      - name: Compile check (src, database, config, DAGs, dashboard, monitoring)
        run: python -m compileall -q src database config airflow/dags dashboard monitoring main.py

      - name: Run unit tests
        run: python -m pytest -m "not integration and not spark" -v

  integration:
    name: Integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway database that lives only for this job.
    # (CI-only credentials: not a secret, the container is never reachable.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION_TESTS: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: pipeline_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: python -m pytest -m integration -v

  spark:
    name: Spark tests (PySpark, Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-spark.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-spark.txt

      - name: Run Spark tests
        run: python -m pytest -m spark -v

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.0"

      - name: Format check
        run: terraform fmt -check -recursive -diff

      # -backend=false: only downloads the provider; never touches state or AWS.
      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  monitoring:
    name: Monitoring (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check Prometheus config and alert rules
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml

      - name: Unit-test the alert rules
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus
          --entrypoint promtool prom/prometheus:v3.5.0
          test rules alerts_test.yml

  security:
    name: Lint and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code (full history, for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff==0.17.6 pip-audit==2.10.1

      - name: Ruff (bugs, imports, Bandit security rules)
        run: ruff check --output-format=github .

      - name: Secret scan of the whole Git history (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner --exit-code 1

      - name: Known vulnerabilities in pinned dependencies (pip-audit)
        run: |
          for f in requirements.txt requirements-spark.txt dashboard/requirements.txt                    monitoring/requirements.txt src/streaming/requirements.txt; do
            echo "== $f"
            pip-audit --no-deps --disable-pip --progress-spinner off -r "$f"
          done

      - name: Misconfigurations in Dockerfiles, Compose and Terraform (Trivy)
        run: >
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.75.0
          config --timeout 15m --exit-code 1 --severity HIGH,CRITICAL
          --ignorefile /repo/.trivyignore.yaml /repo
