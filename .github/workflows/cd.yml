# Continuous delivery: once CI has passed on main, build the platform's
# Docker images, scan them for vulnerabilities, and publish them to GitHub
# Container Registry (ghcr.io, free for public repositories).
#
#   ghcr.io/<owner>/event-platform-airflow     Airflow + Java + PySpark
#   ghcr.io/<owner>/event-platform-dashboard   Streamlit dashboard + metrics exporter
#   ghcr.io/<owner>/event-platform-producer    Kafka producer
#
# Tags: the commit SHA (immutable, what you deploy) and `latest`.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build, scan and publish ${{ matrix.name }}
    # Only for a successful CI run on a push (or a manual run).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # push to ghcr.io; nothing else
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: airflow
            context: .                   # same as docker-compose: the repo root
            dockerfile: airflow/Dockerfile
          - name: dashboard
            context: .
            dockerfile: dashboard/Dockerfile
          - name: producer
            context: .
            dockerfile: src/streaming/Dockerfile

    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name (registry names must be lowercase)
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${owner}/event-platform-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.name.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Vulnerability scan (block CRITICAL issues that have a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"             aquasec/trivy:0.75.0 image --timeout 30m --severity CRITICAL --ignore-unfixed             --scanners vuln --ignorefile /out/.trivyignore.yaml --format json --output /out/trivy.json             ${{ steps.name.outputs.image }}:${{ steps.name.outputs.sha }}
          python3 .github/scripts/trivy_gate.py trivy.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: |
          image="${{ steps.name.outputs.image }}"
          sha="${{ steps.name.outputs.sha }}"
          docker tag "$image:$sha" "$image:latest"
          docker push "$image:$sha"
          docker push "$image:latest"
          echo "Published $image:$sha" >> "$GITHUB_STEP_SUMMARY"
