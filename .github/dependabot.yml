# Dependabot: weekly pull requests for outdated or vulnerable dependencies.
# Each PR runs the full CI, so an upgrade only merges if every test passes.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/dashboard", "/monitoring", "/src/streaming"]
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ["/airflow", "/dashboard", "/src/streaming"]
    schedule: {interval: weekly, day: monday}

  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly, day: monday}
