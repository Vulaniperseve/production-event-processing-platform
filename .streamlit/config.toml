[theme]
# "Midnight aurora": deep indigo background, purple accent, teal for success.
# The animated aurora and card styling live in dashboard/lib/theme.py.
base = "dark"
primaryColor = "#7F77DD"
backgroundColor = "#14122B"
secondaryBackgroundColor = "#221D47"
textColor = "#EEEDFE"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = true
